# .github/workflows/ci.yaml
name: CI

on:
  workflow_call:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened, ready_for_review ]
    paths:
      - "custom_components/**"
      - "pyproject.toml"
      - ".ruff.toml"
      - ".github/workflows/**"
      - "!**/*.md"
      - "!docs/**"
  workflow_dispatch:

# Kill older runs for the same ref (stops “double running” on rapid pushes)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Upgrade pip
        run: python -m pip install -U pip wheel

      - name: Install tooling + deps
        run: |
          pip install homeassistant ha-ffmpeg==3.2.2 ruff mypy pytest types-requests
          pip install "pyezvizapi @ git+https://github.com/adirgan/pyEzvizApi.git@a7710099624008e113269daed0f7f41e3d0b510e"

      - name: Ruff
        run: ruff check .

      - name: mypy
        run: mypy --install-types --non-interactive

      - name: Focused integration tests
        run: >-
          python -m pytest -q
          tests/components/ezviz_plus/test_alarm_control_panel.py
          tests/components/ezviz_plus/test_battery.py
          tests/components/ezviz_plus/test_select.py
