name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    if: "${{ !startsWith(github.event.head_commit.message, 'chore: release ') }}"
    uses: ./.github/workflows/ci.yaml

  hacs:
    if: "${{ !startsWith(github.event.head_commit.message, 'chore: release ') }}"
    uses: ./.github/workflows/HACS.yaml

  hassfest:
    if: "${{ !startsWith(github.event.head_commit.message, 'chore: release ') }}"
    uses: ./.github/workflows/hassfest.yaml

  release:
    if: "${{ !startsWith(github.event.head_commit.message, 'chore: release ') }}"
    needs: [ci, hacs, hassfest]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Increment patch version
        id: version
        run: |
          latest_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"
          if [[ -n "$latest_tag" ]]; then
            current_version="${latest_tag#v}"
          else
            current_version="$(jq -er '.version' custom_components/ezviz_plus/manifest.json)"
          fi
          if [[ ! "$current_version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Current release version is not semantic: $current_version" >&2
            exit 1
          fi

          next_patch="$((BASH_REMATCH[3] + 1))"
          next_version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$next_patch"
          release_tag="v$next_version"
          if git rev-parse -q --verify "refs/tags/$release_tag" >/dev/null; then
            echo "Tag already exists: $release_tag" >&2
            exit 1
          fi

          jq --arg version "$next_version" '.version = $version' \
            custom_components/ezviz_plus/manifest.json > manifest.json.tmp
          mv manifest.json.tmp custom_components/ezviz_plus/manifest.json

          release_date="$(date -u +%Y-%m-%d)"
          python .github/scripts/prepare_release.py \
            "$current_version" "$next_version" "$release_date"

          echo "version=$next_version" >> "$GITHUB_OUTPUT"
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Create release commit and tag
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md README.md custom_components/ezviz_plus/manifest.json
          git commit -m "chore: release $RELEASE_VERSION"
          git tag -a "$RELEASE_TAG" -m "EZVIZ Cloud Plus $RELEASE_VERSION"
          git push origin HEAD:main "$RELEASE_TAG"

      - name: Build HACS archive
        working-directory: custom_components/ezviz_plus
        run: |
          zip -r "$GITHUB_WORKSPACE/ezviz_plus.zip" . \
            -x "*/__pycache__/*" "*.py[cod]" ".DS_Store"

      - name: Verify HACS archive
        run: |
          unzip -t ezviz_plus.zip
          unzip -Z1 ezviz_plus.zip | grep -qx "manifest.json"
          if unzip -Z1 ezviz_plus.zip | grep -Eq '(^|/)(__pycache__|\.DS_Store)(/|$)|\.py[cod]$'; then
            echo "Archive contains excluded runtime files" >&2
            exit 1
          fi

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" ezviz_plus.zip \
            --title "EZVIZ Cloud Plus ${RELEASE_TAG#v}" \
            --notes-file release-notes.md \
            --verify-tag