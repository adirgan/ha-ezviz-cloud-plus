name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release (for example, v0.2.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TAG: ${{ inputs.tag }}
          PUSH_TAG: ${{ github.ref_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$DISPATCH_TAG"
          else
            tag="$PUSH_TAG"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.tag }}

      - name: Verify manifest version
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          manifest_version="$(jq -r '.version' custom_components/ezviz_plus/manifest.json)"
          if [[ "v$manifest_version" != "$RELEASE_TAG" ]]; then
            echo "Tag $RELEASE_TAG does not match manifest version $manifest_version" >&2
            exit 1
          fi

      - name: Build HACS archive
        working-directory: custom_components/ezviz_plus
        run: |
          zip -r "$GITHUB_WORKSPACE/ezviz_plus.zip" . \
            -x "*/__pycache__/*" "*.py[cod]" ".DS_Store"

      - name: Verify HACS archive
        run: |
          unzip -t ezviz_plus.zip
          unzip -Z1 ezviz_plus.zip | grep -qx "manifest.json"
          if unzip -Z1 ezviz_plus.zip | grep -Eq '(^|/)(__pycache__|\.DS_Store)(/|$)|\.py[cod]$'; then
            echo "Archive contains excluded runtime files" >&2
            exit 1
          fi

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" ezviz_plus.zip \
            --title "EZVIZ Cloud Plus ${RELEASE_TAG#v}" \
            --generate-notes \
            --verify-tag